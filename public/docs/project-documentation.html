      const ESC = (v) => String(v ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

      function decodeFirestoreValue(val) {
        if (!val || typeof val !== 'object') return '';
        if ('stringValue' in val) return val.stringValue;
        if ('booleanValue' in val) return val.booleanValue;
        if ('integerValue' in val) return Number(val.integerValue);
        if ('arrayValue' in val) {
          return (val.arrayValue.values || []).map(decodeFirestoreValue);
        }
        return '';
      }

      async function fetchFirestoreProject(pid) {
        if (!pid || !/^[a-zA-Z0-9_-]+$/.test(pid)) return null;
        const url = `https://firestore.googleapis.com/v1/projects/fine-discipline-03kqt/databases/ai-studio-02bb0cf4-4d23-41ff-b141-f9e5ff88de89/documents/projects/${encodeURIComponent(pid)}`;
        try {
          const res = await fetch(url);
          if (!res.ok) return null;
          const json = await res.json();
          if (!json.fields) return null;
          const out = {};
          for (const [k, v] of Object.entries(json.fields)) {
            out[k] = decodeFirestoreValue(v);
          }
          return out;
        } catch {
          return null;
        }
      }

        const sections = [];

        sections.push(`

      async function init() {
        const staticDoc = DOCS[projectId];
        if (staticDoc) {
          renderDocument(staticDoc);
          return;
        }
        const liveDoc = await fetchFirestoreProject(projectId);
        if (liveDoc) {
          renderDocument(liveDoc);
          return;
        }
        renderDocument({
          title: customTitle || 'Student Project Documentation',
          department: customDept || 'CampusConnect Academic Showcase',
          domain: customDomain || 'Capstone Engineering',
          academicYear: '2025-26',
          guide: 'Faculty Advisor',
          teamMembers: ['Project Team'],
          abstract: 'Structured technical documentation generated by CampusConnect for this approved student project.'

      document.getElementById('downloadHtmlBtn').addEventListener('click', () => {
        const paperHtml = document.getElementById('docPaper').outerHTML;
        const docTitle = document.getElementById('docTitle').textContent || 'project-documentation';
        const safeSlug = docTitle.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'project-documentation';
        const styleCss = document.querySelector('style').innerHTML;
        const fullHtml = `<!doctype html><html lang="en"><head><meta charset="UTF-8"><title>${ESC(docTitle)} — Documentation</title><style>${styleCss}</style></head><body><main class="doc-shell">${paperHtml}</main></body></html>`;
        const blob = new Blob([fullHtml], { type: 'text/html;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${safeSlug}-documentation.html`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      });
