<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CampusConnect — Interactive Project Demo</title>
    <meta name="description" content="Interactive live demonstration sandbox for CampusConnect student capstone projects." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --navy-900: #0F172A;
        --cobalt-600: #1D4ED8;
        --cobalt-700: #1E40AF;
        --bg-page: #F8FAFC;
        --bg-surface: #FFFFFF;
        --bg-subtle: #F1F5F9;
        --border: #E2E8F0;
        --text-primary: #0F172A;
        --text-secondary: #475569;
        --text-muted: #64748B;
        --success: #047857;
        --success-bg: #ECFDF5;
        --warn: #B45309;
        --warn-bg: #FFFBEB;
        --danger: #B91C1C;
        --danger-bg: #FEF2F2;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background: var(--bg-page);
        color: var(--text-primary);
        line-height: 1.55;
      }

      h1, h2, h3, h4 {
        font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
        letter-spacing: -0.02em;
      }

      .mono {
        font-family: 'JetBrains Mono', monospace;
      }

      .topbar {
        background: var(--navy-900);
        color: #FFFFFF;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        flex-wrap: wrap;
      }

      .brand {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-weight: 800;
        font-size: 1.125rem;
        color: #FFFFFF;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .brand-tag {
        font-size: 0.72rem;
        font-weight: 600;
        background: rgba(255, 255, 255, 0.14);
        padding: 3px 8px;
        border-radius: 6px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      .top-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      .btn-light {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 14px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.12);
        color: #FFFFFF;
        text-decoration: none;
        font-size: 0.84rem;
        font-weight: 600;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      .btn-light:hover {
        background: rgba(255, 255, 255, 0.2);
      }

      .container {
        max-width: 1040px;
        margin: 0 auto;
        padding: 28px 20px 56px;
      }

      .hero-card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px 28px;
        margin-bottom: 22px;
      }

      .meta-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        font-size: 0.82rem;
        color: var(--cobalt-700);
        font-weight: 600;
        margin-bottom: 8px;
      }

      .hero-card h1 {
        margin: 0 0 8px;
        font-size: clamp(1.35rem, 2.5vw, 1.85rem);
        color: var(--navy-900);
      }

      .hero-card p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 0.95rem;
      }

      .workspace-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
      }

      @media (min-width: 820px) {
        .workspace-grid {
          grid-template-columns: 1.15fr 0.85fr;
        }
      }

      .card {
        background: var(--bg-surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        padding: 22px;
      }

      .card h2 {
        margin: 0 0 14px;
        font-size: 1.08rem;
        color: var(--navy-900);
      }

      .field {
        margin-bottom: 14px;
      }

      .field label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        color: var(--text-secondary);
        margin-bottom: 5px;
      }

      .input, .select, .textarea {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #CBD5E1;
        border-radius: 8px;
        font-family: inherit;
        font-size: 0.9rem;
        background: #FFFFFF;
        color: var(--text-primary);
      }

      .textarea {
        min-height: 92px;
        resize: vertical;
      }

      .btn-primary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 16px;
        border: none;
        border-radius: 8px;
        background: var(--cobalt-600);
        color: #FFFFFF;
        font-family: inherit;
        font-size: 0.88rem;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-primary:hover {
        background: var(--cobalt-700);
      }

      .btn-outline {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 14px;
        border: 1px solid #CBD5E1;
        border-radius: 8px;
        background: #FFFFFF;
        color: var(--text-primary);
        font-family: inherit;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
      }

      .btn-outline:hover {
        background: var(--bg-subtle);
      }

      .kpi-row {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        margin-bottom: 14px;
      }

      .kpi {
        background: var(--bg-subtle);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
      }

      .kpi-label {
        font-size: 0.74rem;
        color: var(--text-muted);
      }

      .kpi-val {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--navy-900);
        margin-top: 2px;
      }

      .log-box {
        background: #0F172A;
        color: #E2E8F0;
        border-radius: 10px;
        padding: 14px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 0.78rem;
        line-height: 1.55;
        max-height: 240px;
        overflow-y: auto;
        white-space: pre-wrap;
      }

      .status-pill {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 6px;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .status-ok { background: var(--success-bg); color: var(--success); }
      .status-warn { background: var(--warn-bg); color: var(--warn); }
      .status-danger { background: var(--danger-bg); color: var(--danger); }

      .list-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        padding: 10px 12px;
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 8px;
        font-size: 0.875rem;
      }

      .bar-track {
        height: 10px;
        background: var(--bg-subtle);
        border-radius: 999px;
        overflow: hidden;
        margin-top: 4px;
      }

      .bar-fill {
        height: 100%;
        background: var(--cobalt-600);
        border-radius: 999px;
        transition: width 180ms ease;
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a href="/index.html" class="brand">
        <span>CampusConnect</span>
        <span class="brand-tag">Interactive Demo</span>
      </a>
      <div class="top-actions">
        <a id="repoTopBtn" href="https://github.com" target="_blank" rel="noopener noreferrer" class="btn-light" style="display:none;">View Source Code</a>
        <a href="/index.html" class="btn-light">Back to Portal</a>
      </div>
    </header>

    <main class="container">
      <section class="hero-card">
        <div class="meta-row">
          <span id="demoDept">Department</span>
          <span>&middot;</span>
          <span id="demoDomain">Interactive Sandbox</span>
          <span>&middot;</span>
          <span id="demoProjectId" class="mono">project</span>
        </div>
        <h1 id="demoTitle">Project Live Demonstration</h1>
        <p id="demoSubtitle">Interactive browser demonstration illustrating the core workflow, inputs, and live outputs of this project.</p>
      </section>

      <div id="demoContent"></div>
    </main>

    <script>
      const params = new URLSearchParams(window.location.search);
      const projectId = params.get('project') || 'custom';
      const customTitle = params.get('title') || '';
      const customDept = params.get('dept') || '';

      const DEMOS = {
        proj_cse_healthcare_mgmt: {
          title: 'Smart Healthcare Management System',
          dept: 'CSE · Healthcare Systems',
          domain: 'Appointment Triage & Pharmacy Fulfillment',
          repo: 'https://github.com/Savidya9800/Smart-Healthcare-Management-System',
          desc: 'Simulate outpatient intake, clinician queue priority, and live pharmacy prescription fulfillment.',
          render(root) {
            const queue = [
              { id: 'PT-101', name: 'Ananya Nair', dept: 'Cardiology', triage: 'Urgent', rx: 'Atorvastatin 20mg', filled: false },
              { id: 'PT-102', name: 'Vikram Joshi', dept: 'General Medicine', triage: 'Standard', rx: 'Amoxicillin 500mg', filled: true }
            ];
            root.innerHTML = `
              <div class="workspace-grid">
                <div class="card">
                  <h2>Outpatient Intake &amp; Triage Registration</h2>
                  <div class="field"><label>Patient Name</label><input id="hcName" class="input" value="Rohan Kulkarni" /></div>
                  <div class="field"><label>Specialty Clinic</label>
                    <select id="hcDept" class="select">
                      <option>General Medicine</option><option>Cardiology</option><option>Orthopedics</option><option>Pediatrics</option>
                    </select>
                  </div>
                  <div class="field"><label>Triage Priority</label>
                    <select id="hcTriage" class="select">
                      <option>Standard</option><option>Urgent</option><option>Follow-up</option>
                    </select>
                  </div>
                  <div class="field"><label>Prescribed Medication</label><input id="hcRx" class="input" value="Metformin 500mg" /></div>
                  <button type="button" id="hcAddBtn" class="btn-primary">Admit Patient to Queue</button>
                </div>
                <div class="card">
                  <h2>Live Clinic &amp; Pharmacy Queue</h2>
                  <div class="kpi-row">
                    <div class="kpi"><div class="kpi-label">Active Patients</div><div class="kpi-val" id="hcCount">2</div></div>
                    <div class="kpi"><div class="kpi-label">Rx Pending</div><div class="kpi-val" id="hcPending">1</div></div>
                  </div>
                  <div id="hcList"></div>
                </div>
              </div>
            `;
            const renderList = () => {
              document.getElementById('hcCount').textContent = queue.length;
              document.getElementById('hcPending').textContent = queue.filter((q) => !q.filled).length;
              document.getElementById('hcList').innerHTML = queue.map((q, idx) => `
                <div class="list-row">
                  <div>
                    <strong>${q.id} · ${q.name}</strong>
                    <div style="font-size:0.78rem;color:var(--text-muted);">${q.dept} · ${q.triage} · Rx: ${q.rx}</div>
                  </div>
                  <button type="button" class="btn-outline" data-rx="${idx}">${q.filled ? 'Dispensed' : 'Dispense Rx'}</button>
                </div>
              `).join('');
              root.querySelectorAll('[data-rx]').forEach((btn) => {
                btn.addEventListener('click', () => {
                  const i = Number(btn.getAttribute('data-rx'));
                  queue[i].filled = !queue[i].filled;
                  renderList();
                });
              });
            };
            renderList();
            document.getElementById('hcAddBtn').addEventListener('click', () => {
              const name = document.getElementById('hcName').value.trim() || 'Patient';
              queue.unshift({
                id: `PT-${103 + queue.length}`,
                name,
                dept: document.getElementById('hcDept').value,
                triage: document.getElementById('hcTriage').value,
                rx: document.getElementById('hcRx').value.trim() || 'Saline',
                filled: false
              });
              renderList();
            });
          }
        },

        proj_ra_agriculture_robot: {
          title: 'Smart Agriculture Robot',
          dept: 'R&A · Autonomous Robotics',
          domain: 'ESP32 Field Rover & Soil Telemetry',
          repo: 'https://github.com/gobinda789/Smart-Agriculture-Bot',
          desc: 'Control rover motion, trigger precision seed sowing, and simulate soil-moisture threshold irrigation.',
          render(root) {
            let moisture = 34;
            let pumpOn = true;
            let seedsDropped = 12;
            root.innerHTML = `
              <div class="workspace-grid">
                <div class="card">
                  <h2>ESP32 Rover &amp; Actuator Controls</h2>
                  <div class="field">
                    <label>Simulated Soil Moisture: <span id="agMoistLbl" class="mono">34%</span> (Auto-irrigate below 40%)</label>
                    <input type="range" id="agMoist" min="5" max="95" value="34" style="width:100%;" />
                  </div>
                  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
                    <button type="button" class="btn-primary" data-cmd="FORWARD">Move Forward</button>
                    <button type="button" class="btn-outline" data-cmd="LEFT">Steer Left</button>
                    <button type="button" class="btn-outline" data-cmd="RIGHT">Steer Right</button>
                    <button type="button" class="btn-outline" data-cmd="SOW">Dispense Seed</button>
                    <button type="button" class="btn-outline" data-cmd="PLOUGH">Toggle Plough</button>
                  </div>
                  <div class="kpi-row">
                    <div class="kpi"><div class="kpi-label">Irrigation Valve</div><div class="kpi-val" id="agValve">OPEN</div></div>
                    <div class="kpi"><div class="kpi-label">Seeds Sown</div><div class="kpi-val" id="agSeeds">12</div></div>
                  </div>
                </div>
                <div class="card">
                  <h2>ESP32 WebSocket Telemetry Stream</h2>
                  <div id="agLog" class="log-box"></div>
                </div>
              </div>
            `;
            const logEl = document.getElementById('agLog');
            const pushLog = (msg) => {
              const t = new Date().toLocaleTimeString();
              logEl.textContent = `[${t}] ${msg}\n` + logEl.textContent;
            };
            pushLog('ESP32 Rocker-Bogie Rover online. DHT22: 28.4C | Soil: 34% | Auto-pump ON');
            document.getElementById('agMoist').addEventListener('input', (e) => {
              moisture = Number(e.target.value);
              pumpOn = moisture < 40;
              document.getElementById('agMoistLbl').textContent = `${moisture}%`;
              document.getElementById('agValve').textContent = pumpOn ? 'OPEN' : 'CLOSED';
              pushLog(`ADC Soil Moisture = ${moisture}% -> Irrigation relay ${pumpOn ? 'OPEN' : 'CLOSED'}`);
            });
            root.querySelectorAll('[data-cmd]').forEach((b) => {
              b.addEventListener('click', () => {
                const cmd = b.getAttribute('data-cmd');
                if (cmd === 'SOW') {
                  seedsDropped += 1;
                  document.getElementById('agSeeds').textContent = seedsDropped;
                  pushLog(`Servo actuator pulsed: Seed #${seedsDropped} planted.`);
                } else {
                  pushLog(`L298N Motor Command dispatched: ${cmd}`);
                }
              });
            });
          }
        },

        proj_csecs_phishing_detection: {
          title: 'Phishing Website Detection',
          dept: 'CSECS · Network & Web Security',
          domain: 'Lexical & Host Feature Classifier',
          repo: 'https://github.com/shreyagopal/Phishing-Website-Detection-by-Machine-Learning-Techniques',
          desc: 'Test suspicious vs. legitimate URLs against lexical phishing indicators extracted in real time.',
          render(root) {
            root.innerHTML = `
              <div class="workspace-grid">
                <div class="card">
                  <h2>URL Feature Inspector</h2>
                  <div class="field">
                    <label>Enter URL to Evaluate</label>
                    <input id="phUrl" class="input mono" value="http://192.168.1.44/secure-login-verify-bank/update.php?session=991" />
                  </div>
                  <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
                    <button type="button" id="phScanBtn" class="btn-primary">Analyze URL Features</button>
                    <button type="button" id="phSafeBtn" class="btn-outline">Load Legitimate URL</button>
                  </div>
                  <div id="phVerdict"></div>
                </div>
                <div class="card">
                  <h2>Extracted Feature Vector</h2>
                  <div id="phFeatures"></div>
                </div>
              </div>
            `;
            const analyze = () => {
              const raw = document.getElementById('phUrl').value.trim();
              let score = 0;
              const isHttps = raw.startsWith('https://');
              const hasIp = /\b\d{1,3}(\.\d{1,3}){3}\b/.test(raw);
              const hasAt = raw.includes('@');
              const longUrl = raw.length > 54;
              const hasSuspicious = /(verify|update|secure-login|signin|account|bank)/i.test(raw);
              const hyphenCount = (raw.match(/-/g) || []).length;

              if (!isHttps) score += 25;
              if (hasIp) score += 30;
              if (hasAt) score += 20;
              if (longUrl) score += 15;
              if (hasSuspicious) score += 20;
              if (hyphenCount >= 2) score += 10;
              score = Math.min(100, score);

              const cls = score >= 50 ? 'status-danger' : score >= 25 ? 'status-warn' : 'status-ok';
              const label = score >= 50 ? 'HIGH PHISHING RISK' : score >= 25 ? 'SUSPICIOUS' : 'LIKELY BENIGN';
              document.getElementById('phVerdict').innerHTML = `
                <div class="kpi">
                  <div class="kpi-label">Classifier Verdict</div>
                  <div style="margin-top:6px;display:flex;align-items:center;gap:10px;">
                    <span class="status-pill ${cls}">${label}</span>
                    <span class="mono">Risk Score: ${score}/100</span>
                  </div>
                </div>
              `;
              document.getElementById('phFeatures').innerHTML = [
                ['Protocol HTTPS', isHttps ? 'Yes (0)' : 'No (+25)'],
                ['IP Address in Host', hasIp ? 'Detected (+30)' : 'None (0)'],
                ['URL Length > 54 chars', `${raw.length} chars (${longUrl ? '+15' : '0'})`],
                ['@ Symbol Redirect', hasAt ? 'Detected (+20)' : 'None (0)'],
                ['Credential Lure Tokens', hasSuspicious ? 'Matched (+20)' : 'None (0)'],
                ['Domain Hyphens', `${hyphenCount} (${hyphenCount >= 2 ? '+10' : '0'})`]
              ].map(([k, v]) => `<div class="list-row"><span>${k}</span><strong class="mono">${v}</strong></div>`).join('');
            };
            analyze();
            document.getElementById('phScanBtn').addEventListener('click', analyze);
            document.getElementById('phSafeBtn').addEventListener('click', () => {
              document.getElementById('phUrl').value = 'https://github.com/shreyagopal';
              analyze();
            });
          }
        },

        proj_ece_smart_home: {
          title: 'Smart Home Automation',
          dept: 'ECE · Embedded Systems & FreeRTOS',
          domain: 'ESP32 Multitasking Relay & Safety Panel',
          repo: 'https://github.com/parikshitpagare/smart-home-automation-rtos',
          desc: 'Toggle household relay loads and simulate DHT11 temperature & MQ-2 smoke safety overrides.',
          render(root) {
            const relays = { lights: true, fan: false, alarm: false };
            root.innerHTML = `
              <div class="workspace-grid">
                <div class="card">
                  <h2>FreeRTOS Sensor &amp; Relay Controls</h2>
                  <div class="field">
                    <label>Ambient Temperature (DHT11): <span id="shTempLbl" class="mono">26°C</span></label>
                    <input type="range" id="shTemp" min="16" max="45" value="26" style="width:100%;" />
                  </div>
                  <div class="field">
                    <label>Gas / Smoke Level (MQ-2): <span id="shGasLbl" class="mono">180 ppm</span></label>
                    <input type="range" id="shGas" min="80" max="900" value="180" style="width:100%;" />
                  </div>
                  <div style="display:flex;gap:8px;flex-wrap:wrap;">
                    <button type="button" class="btn-primary" id="shToggleLight">Toggle Lighting Relay</button>
                    <button type="button" class="btn-outline" id="shToggleFan">Toggle Cooling Fan</button>
                  </div>
                </div>
                <div class="card">
                  <h2>ESP32 OLED &amp; Task Status</h2>
                  <div id="shStatus"></div>
                </div>
              </div>
            `;
            const render = () => {
              const temp = Number(document.getElementById('shTemp').value);
              const gas = Number(document.getElementById('shGas').value);
              if (temp >= 32) relays.fan = true;
              relays.alarm = gas >= 500;
              document.getElementById('shTempLbl').textContent = `${temp}°C`;
              document.getElementById('shGasLbl').textContent = `${gas} ppm`;
              document.getElementById('shStatus').innerHTML = `
                <div class="list-row"><span>Task 1 · Lighting Relay</span><span class="status-pill ${relays.lights ? 'status-ok' : 'status-warn'}">${relays.lights ? 'ON' : 'OFF'}</span></div>
                <div class="list-row"><span>Task 2 · Cooling Fan (Auto >= 32°C)</span><span class="status-pill ${relays.fan ? 'status-ok' : 'status-warn'}">${relays.fan ? 'RUNNING' : 'IDLE'}</span></div>
                <div class="list-row"><span>Task 3 · MQ-2 Smoke Cutoff (>= 500 ppm)</span><span class="status-pill ${relays.alarm ? 'status-danger' : 'status-ok'}">${relays.alarm ? 'ALERT TRIPPED' : 'SAFE'}</span></div>
              `;
            };
            render();
            document.getElementById('shTemp').addEventListener('input', render);
            document.getElementById('shGas').addEventListener('input', render);
            document.getElementById('shToggleLight').addEventListener('click', () => { relays.lights = !relays.lights; render(); });
            document.getElementById('shToggleFan').addEventListener('click', () => { relays.fan = !relays.fan; render(); });
          }
        },

        proj_aids_student_performance: {
          title: 'Student Performance Prediction',
          dept: 'AI&DS · Predictive Analytics',
          domain: 'Regression Score Forecaster',
          repo: 'https://github.com/william-laverty/ML-Student-Performance-Predictor',
          desc: 'Adjust study habits, attendance, and prior exam scores to forecast final academic performance.',
          render(root) {
            root.innerHTML = `
              <div class="workspace-grid">
                <div class="card">
                  <h2>Student Feature Inputs</h2>
                  <div class="field"><label>Prior Midterm Score (0–20): <span id="spG1Lbl" class="mono">14</span></label><input type="range" id="spG1" min="0" max="20" value="14" style="width:100%;" /></div>
                  <div class="field"><label>Weekly Study Hours: <span id="spStudyLbl" class="mono">8 hrs</span></label><input type="range" id="spStudy" min="1" max="25" value="8" style="width:100%;" /></div>
                  <div class="field"><label>Attendance Rate: <span id="spAttLbl" class="mono">88%</span></label><input type="range" id="spAtt" min="30" max="100" value="88" style="width:100%;" /></div>
                  <div class="field"><label>Past Course Failures: <span id="spFailLbl" class="mono">0</span></label><input type="range" id="spFail" min="0" max="4" value="0" style="width:100%;" /></div>
                </div>
                <div class="card">
                  <h2>Predicted Final Grade</h2>
                  <div class="kpi-row">
                    <div class="kpi"><div class="kpi-label">Predicted Score</div><div class="kpi-val" id="spPred">15.1 / 20</div></div>

              document.getElementById('spStudyLbl').textContent = `${study} hrs`;
              document.getElementById('spAttLbl').textContent = `${att}%`;
              document.getElementById('spFailLbl').textContent = fail;
              const pred = Math.max(0, Math.min(20, 0.78 * g1 + 0.14 * study + 0.035 * att - 1.4 * fail));
